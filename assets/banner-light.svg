<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" width="100%" height="100%">
  <defs>
    <!-- Gradients for routing paths and nodes -->
    <linearGradient id="grad-gemini" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <linearGradient id="grad-anthropic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FDBA74" />
    </linearGradient>
    <linearGradient id="grad-groq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#F87171" />
    </linearGradient>
    <linearGradient id="grad-gateway" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" /> <!-- Cyan -->
      <stop offset="100%" stop-color="#8B5CF6" /> <!-- Violet -->
    </linearGradient>
    <linearGradient id="grad-routing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="grad-client" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    
    <style>
      .text-logo {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 52px;
        font-weight: 800;
        letter-spacing: -2px;
        fill: #111827; /* Dark text for light mode */
      }
      .text-dot {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 52px;
        font-weight: 800;
        letter-spacing: -2px;
        fill: url(#grad-gateway);
      }
    </style>
  </defs>

  <!-- Router illustration -->
  <g transform="translate(10, 0)">
    <!-- Incoming channels (Gemini, Anthropic, Groq) -->
    <path d="M 40,45 C 70,45 85,75 105,75" fill="none" stroke="url(#grad-routing)" stroke-width="6" stroke-linecap="round" />
    <path d="M 40,105 C 70,105 85,75 105,75" fill="none" stroke="url(#grad-routing)" stroke-width="6" stroke-linecap="round" />
    <path d="M 40,75 L 105,75" fill="none" stroke="url(#grad-routing)" stroke-width="6" stroke-linecap="round" />
    
    <!-- Outgoing channel to Client -->
    <path d="M 105,75 H 160" fill="none" stroke="url(#grad-client)" stroke-width="8" stroke-linecap="round" />

    <!-- Endpoint Nodes -->
    <circle cx="40" cy="45" r="7" fill="url(#grad-gemini)" />
    <circle cx="40" cy="75" r="7" fill="url(#grad-anthropic)" />
    <circle cx="40" cy="105" r="7" fill="url(#grad-groq)" />

    <!-- Central Gateway Hub -->
    <circle cx="105" cy="75" r="14" fill="url(#grad-gateway)" />
    <circle cx="105" cy="75" r="6" fill="#FFFFFF" />
  </g>

  <!-- Wordmark text -->
  <text x="200" y="92" class="text-logo">LLM Gateway</text>
  <text x="525" y="92" class="text-dot">.</text>
</svg>
