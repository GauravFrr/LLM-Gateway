global:
  scrape_interval: ${PROMETHEUS_SCRAPE_INTERVAL}
  evaluation_interval: ${PROMETHEUS_SCRAPE_INTERVAL}

scrape_configs:
  - job_name: 'llm-gateway'
    static_configs:
      # gateway:8000 for docker compose, host.docker.internal:8000 for local dev server
      - targets: ['gateway:8000', 'host.docker.internal:8000']
