name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio httpx asyncpg
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Ruff Lint check
      run: ruff check .

    - name: Run Ruff Format check
      run: ruff format --check .

    - name: Run Pytest
      # Integration tests run against real Postgres 15 + Redis 7 service containers.
      # Unit tests run in the same environment. MOCK_PROVIDERS=True prevents real API calls.
      env:
        DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/gateway"
        REDIS_URL: "redis://localhost:6379/0"
        MOCK_PROVIDERS: "True"
        ADMIN_API_KEY: "abcd"
        OTEL_CONSOLE_EXPORT: "False"
      run: pytest
